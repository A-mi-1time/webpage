<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自己紹介</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --text: #222831;
      --muted: #667085;
      --accent: #2563eb;
      --card: #ffffff;
      --border: #d9dee8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(100%, 720px);
      padding: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 16px 40px rgb(34 40 49 / 8%);
    }

    .profile {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #e8f0ff;
      color: var(--accent);
      font-size: 40px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    section + section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    p {
      margin: 0;
    }

    ul {
      margin: 0;
      padding-left: 1.2em;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    @media (max-width: 560px) {
      main {
        padding: 28px 22px;
      }

      .profile {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <div class="avatar" aria-hidden="true">名</div>
      <div>
        <h1>前島菜花</h1>
        <p class="subtitle">ディズニーランドが好きな学生 /  </p>
      </div>
    </header>

    <section aria-labelledby="about-title">
      <h2 id="about-title">自己紹介</h2>
      <p>
        こんにちは。新しい技術を学びながら、見やすく使いやすいWebページを作ることに興味があります。
        このページでは、プロフィールや好きなことを簡単にまとめています。
      </p>
    </section>

    <section aria-labelledby="likes-title">
      <h2 id="likes-title">好きなこと</h2>
      <ul>
        <li>Webデザイン</li>
        <li>プログラミング</li>
        <li>音楽を聴くこと</li>
      </ul>
    </section>

    <section aria-labelledby="contact-title">
      <h2 id="contact-title">連絡先</h2>
      <p>
        Email: <a href="mailto:your-name@example.com">your-name@example.com</a>
      </p>
    </section>
  </main>
</body>
</html>
